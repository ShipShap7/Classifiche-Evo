name: Update Standings

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch standings from football-data.org
        env:
          API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          mkdir -p data

          curl -s -H "X-Auth-Token: $API_KEY" \
            "https://api.football-data.org/v4/competitions/SA/standings" \
            -o data/seriea.json

          curl -s -H "X-Auth-Token: $API_KEY" \
            "https://api.football-data.org/v4/competitions/SB/standings" \
            -o data/serieb.json

          curl -s -H "X-Auth-Token: $API_KEY" \
            "https://api.football-data.org/v4/competitions/CL/standings" \
            -o data/champions.json

      - name: Commit and push JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update standings $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
